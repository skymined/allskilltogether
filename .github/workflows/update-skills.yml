name: Update skills data

on:
  schedule:
    # 03:17 UTC daily (~12:17 KST)
    - cron: "17 3 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "data/sources.json"
      - "data/categories.json"
      - "scripts/fetch-skills.mjs"

permissions:
  contents: write

concurrency:
  group: update-skills
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest skills
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-skills.mjs

      - name: Refresh README stats
        run: node scripts/update-readme.mjs

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/skills.json README.md; then
            echo "No skill changes."
            exit 0
          fi
          git add data/skills.json README.md
          git commit -m "chore: update skills data ($(date -u +%Y-%m-%d))"
          # A manual push to main while this job was scanning is a normal
          # race, not a failure — rebase onto it and retry a few times
          # rather than letting the job fail on a stale push.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing onto latest main (attempt $attempt)..."
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::could not push skills data update after retries"
          exit 1
